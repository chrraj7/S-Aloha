name: s-aloha

services:
  db:
    # pgvector (ADR-0022) : même PostgreSQL 16, avec l'extension « vector ».
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_DB: saloha
      POSTGRES_USER: saloha
      # S1 : aucun secret dans ce fichier ; à fournir par l'environnement ou un fichier .env
      # (docs/reference/exploitation.md § Secrets). Vide : PostgreSQL refuse de démarrer.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saloha"]
      interval: 5s
      retries: 10

  api:
    # Image `edge` (état de `main`) par défaut ; S_ALOHA_VERSION fige une version ; « up --build » construit depuis les sources.
    image: ghcr.io/chrraj7/s-aloha-api:${S_ALOHA_VERSION:-edge}
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Database=saloha;Username=saloha;Password=${POSTGRES_PASSWORD:-}"
      # --- Active Directory on-prem : à adapter ---
      Ldap__Host: "dc01.mondomaine.local"
      Ldap__Port: "389"
      Ldap__UseSsl: "false"
      Ldap__BaseDn: "DC=mondomaine,DC=local"
      Ldap__BindUser: "CN=svc-saloha,OU=Services,DC=mondomaine,DC=local"
      Ldap__BindPassword: "MotDePasseServiceAccount"
      Ldap__UserFilter: "(&(objectClass=user)(sAMAccountName={0}))"
      # --- Mapping groupes AD -> rôles applicatifs ---
      Ldap__Groups__Admin: "GRP-SALOHA-ADMINS"
      Ldap__Groups__Manager: "GRP-SALOHA-MANAGERS"
      Ldap__Groups__User: "GRP-SALOHA-USERS"
      # S1 : vide, l'API refuse de démarrer hors développement (moins de 64 caractères, S7).
      Jwt__Key: "${JWT_KEY:-}"
      # --- Découverte automatique (CFG-45) : clé du coffre d'identifiants, hors de la base ---
      # À changer avant le premier identifiant enregistré : la changer ensuite rend les secrets illisibles.
      # Vide : le coffre refuse d'enregistrer un identifiant (S1).
      Discovery__VaultKey: "${DISCOVERY_VAULT_KEY:-}"
      # --- Recherche hybride (ADR-0013) : service d'embeddings ci-dessous ---
      # Vide : recherche par les mots seulement. L'API n'attend pas ce service.
      Embeddings__Url: "http://embeddings:11434"
      Embeddings__Model: "bge-m3"
      # --- Fonctionnalités optionnelles (ADR-0023) : conteneur « features », profil « fonctionnalites » ---
      # Vides : tri assisté et CMDB assistée indisponibles. Avec le profil : FEATURES_URL=http://features:8080
      # et FEATURES_TOKEN, le même secret qu'au conteneur (32 caractères au moins : openssl rand -hex 32).
      Features__Url: "${FEATURES_URL:-}"
      Features__Token: "${FEATURES_TOKEN:-}"
      # Serveur MCP (ADR-0024) : conteneur « mcp », profil « mcp ». Vide : serveur MCP indisponible.
      # Avec le profil : MCP_URL=http://mcp:8080 ; aucun jeton (le conteneur n'a pas de secret, MCP-02).
      Mcp__Url: "${MCP_URL:-}"
    # 8081 (port interne des fonctionnalités, OPT-11) n'est jamais publié : le conteneur « features »
    # l'atteint sur le réseau du compose.
    ports:
      - "8080:8080"
    # O1 : disponibilité (base comprise) ; l'image aspnet n'a ni curl ni wget, bash suffit.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3

  embeddings:
    # Embeddings bge-m3 servis par Ollama, hors du processus de l'API (ADR-0013).
    # Premier démarrage : téléchargement du modèle (~1,2 Go), gardé dans le volume.
    image: ollama/ollama:0.40.16
    entrypoint: ["/bin/sh", "-c", "ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull bge-m3 && wait"]
    volumes:
      - ollama:/root/.ollama
    # bge-m3 occupe ~1,2 Go une fois chargé ; marge pour les pics de calcul.
    mem_limit: 3g

  garage:
    # Pièces jointes (SOC-25, ADR-0020) : stockage compatible S3, démarré seulement avec le
    # profil « pieces-jointes ». Réglage dans Administration › Messagerie et stockage :
    # adresse http://garage:3900, région garage (docs/reference/exploitation.md).
    image: dxflrs/garage:v2.5.0
    profiles: ["pieces-jointes"]
    environment:
      # Obligatoire avec le profil (sinon Garage refuse de démarrer) : openssl rand -hex 32.
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  features:
    # Fonctionnalités optionnelles hors de l'API (tri assisté des tickets, CMDB assistée), démarrées
    # seulement avec le profil « fonctionnalites », puis activées par l'Admin (Administration ›
    # Fonctionnalités optionnelles). Aucune ligne « ports: » : seule l'API l'appelle. Arrêté, ses
    # fonctionnalités sont indisponibles, rien d'autre (OPT-05).
    image: ghcr.io/chrraj7/s-aloha-features:${S_ALOHA_VERSION:-edge}
    build: ./features/SAloha.Features
    profiles: ["fonctionnalites"]
    environment:
      # Même secret qu'à l'API (OPT-10) ; vide ou trop court : le conteneur refuse tout appel.
      Features__Token: "${FEATURES_TOKEN:-}"
      # Port interne de l'API (OPT-11), jamais le port public.
      Api__Url: "http://api:8081"
      Embeddings__Url: "http://embeddings:11434"
    healthcheck:
      # Le contrôle de santé exige le jeton, comme pour l'API ; l'image aspnet n'a ni curl ni wget.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nAuthorization: Bearer %s\\r\\n\\r\\n' \"$$Features__Token\" >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  mcp:
    # Serveur MCP en lecture seule (ADR-0024), démarré seulement avec le profil « mcp », puis activé par
    # l'Admin. Aucune ligne « ports: » : nginx y relaie /mcp, l'API y lit /health. Il appelle le port
    # public de l'API avec le jeton personnel de chaque utilisateur, jamais avec le sien (MCP-02).
    image: ghcr.io/chrraj7/s-aloha-mcp:${S_ALOHA_VERSION:-edge}
    build: ./features/SAloha.Mcp
    profiles: ["mcp"]
    environment:
      # Port public de l'API, jamais le port interne.
      Api__Url: "http://api:8080"
    healthcheck:
      # Contrôle de santé sans jeton (ADR-0024) ; l'image aspnet n'a ni curl ni wget.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  web:
    image: ghcr.io/chrraj7/s-aloha-web:${S_ALOHA_VERSION:-edge}
    build: ./frontend
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  pgdata:
  ollama:
  garage-meta:
  garage-data:
