# Retire des textes publiés par le compte du mainteneur un pied de page ajouté
# automatiquement par un outil (motif dans le secret PIED_A_RETIRER, jamais affiché) :
# un commentaire d'issue ou de PR est republié propre (sans historique de l'ancien
# texte), une description de PR, une revue ou un commentaire de ligne est corrigé.
# scripts/retirer-pied.py ; ne lit que le texte de l'événement, n'exécute rien du dépôt.
name: Commentaires

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, edited]

permissions:
  contents: read

jobs:
  pied:
    name: Pied de page
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/retirer-pied.py
          sparse-checkout-cone-mode: false
      - name: Retrait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIED: ${{ secrets.PIED_A_RETIRER }}
        run: python3 scripts/retirer-pied.py
