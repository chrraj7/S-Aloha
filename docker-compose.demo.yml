# Mode démonstration : essayer S-Aloha sans Active Directory d'entreprise.
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d
#
# Ajoute un contrôleur de domaine Samba AD (domaine SALOHA.LAN) et y branche l'API.
# Comptes de démonstration, un par rôle : demo.admin, demo.manager, demo.user
# (mots de passe ci-dessous), et données d'exemple fictives chargées par l'API au
# premier démarrage. Mots de passe PUBLICS : jamais en production —
# docs/reference/exploitation.md § Mode démonstration.

services:
  # S1 : les secrets d'exemple ne vivent qu'ici ; ils remplacent les valeurs vides de
  # docker-compose.yml après la fusion des deux fichiers.
  db:
    environment:
      POSTGRES_PASSWORD: "ChangeMe_Str0ng!"

  annuaire:
    image: ghcr.io/chrraj7/s-aloha-annuaire-demo:${S_ALOHA_VERSION:-edge}
    build: ./demo/annuaire
    # Nom NetBIOS du contrôleur, figé au provisionnement.
    hostname: dc01
    # Samba AD a besoin des attributs étendus du système de fichiers.
    privileged: true
    environment:
      AD_REALM: SALOHA.LAN
      AD_DOMAIN: SALOHA
      AD_ADMIN_PASSWORD: "Demo-Domaine-2026"
      SVC_PASSWORD: "Demo-Service-2026"
      DEMO_ADMIN_PASSWORD: "Demo-Admin-2026"
      DEMO_MANAGER_PASSWORD: "Demo-Manager-2026"
      DEMO_USER_PASSWORD: "Demo-User-2026"
    volumes:
      - annuaire:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/389"]
      interval: 5s
      retries: 60

  api:
    depends_on:
      annuaire:
        condition: service_healthy
    environment:
      Ldap__Host: annuaire
      Ldap__BaseDn: "DC=saloha,DC=lan"
      Ldap__BindUser: "CN=svc-saloha,CN=Users,DC=saloha,DC=lan"
      Ldap__BindPassword: "Demo-Service-2026"
      ConnectionStrings__Default: "Host=db;Database=saloha;Username=saloha;Password=ChangeMe_Str0ng!"
      Jwt__Key: "CHANGEZ-CETTE-CLE-SECRETE-DE-64-CARACTERES-MINIMUM-0123456789ab"
      Discovery__VaultKey: "CHANGEZ-CETTE-CLE-DU-COFFRE-DE-32-CARACTERES-MINIMUM-0123456789"
      # Conteneur « features » (OPT-10) : démarré d'office en démonstration, le tri assisté activé par
      # les données d'exemple (demo/donnees/charger.py) ; la CMDB assistée et le serveur MCP restent coupés.
      Features__Url: "http://features:8080"
      Features__Token: "CHANGEZ-CE-JETON-DU-CONTENEUR-FEATURES-DE-32-CARACTERES-MINIMUM"
      # S7 : clé JWT et mot de passe de base d'exemple acceptés ici, et seulement ici (démonstration).
      Security__AllowSampleSecrets: "true"

  # Même jeton d'exemple qu'à l'API, accepté ici seulement (S7). En démonstration, le conteneur démarre sans
  # le profil « fonctionnalites » (« !reset » : Docker Compose 2.24 ou plus).
  features:
    profiles: !reset []
    environment:
      Features__Token: "CHANGEZ-CE-JETON-DU-CONTENEUR-FEATURES-DE-32-CARACTERES-MINIMUM"
      Security__AllowSampleSecrets: "true"

  # Charge une seule fois des données d'exemple fictives, par l'API (demo/donnees/).
  donnees:
    image: python:3.15-alpine
    depends_on:
      - api
    volumes:
      - ./demo/donnees:/donnees:ro
    command: ["python3", "/donnees/charger.py", "http://api:8080"]
    restart: "no"

volumes:
  annuaire:
